<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">MalmöConsent – startanimation med referensens åttabladiga bländare</title>
  <desc id="desc">De åtta vita lamellerna följer den bifogade bländarikonens exakta upprepade form. De öppnas kring en större vit smiley som blinkar mjukt. Bakgrunden är transparent.</desc>

  <defs>
    <path id="blade" d="M 97.73 205.17 A 498.75 498.75 0 0 1 384.93 14.71 L 575 205 Z">
      <animate attributeName="d" dur=".34s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".35 0 .18 1"
        values="M 97.73 205.17 A 498.75 498.75 0 0 1 384.93 14.71 L 500 500 Z;
                M 97.73 205.17 A 498.75 498.75 0 0 1 384.93 14.71 L 575 205 Z"/>
    </path>
  </defs>

  <g fill="#ffffff" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".08s" fill="freeze"/>
    <use href="#blade" transform="rotate(-8 500 500)">
      <animateTransform attributeName="transform" type="rotate" from="-8 500 500" to="0 500 500" dur=".34s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".35 0 .18 1"/>
    </use>
    <use href="#blade" transform="rotate(37 500 500)">
      <animateTransform attributeName="transform" type="rotate" from="37 500 500" to="45 500 500" dur=".34s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".35 0 .18 1"/>
    </use>
    <use href="#blade" transform="rotate(82 500 500)">
      <animateTransform attributeName="transform" type="rotate" from="82 500 500" to="90 500 500" dur=".34s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".35 0 .18 1"/>
    </use>
    <use href="#blade" transform="rotate(127 500 500)">
      <animateTransform attributeName="transform" type="rotate" from="127 500 500" to="135 500 500" dur=".34s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".35 0 .18 1"/>
    </use>
    <use href="#blade" transform="rotate(172 500 500)">
      <animateTransform attributeName="transform" type="rotate" from="172 500 500" to="180 500 500" dur=".34s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".35 0 .18 1"/>
    </use>
    <use href="#blade" transform="rotate(217 500 500)">
      <animateTransform attributeName="transform" type="rotate" from="217 500 500" to="225 500 500" dur=".34s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".35 0 .18 1"/>
    </use>
    <use href="#blade" transform="rotate(262 500 500)">
      <animateTransform attributeName="transform" type="rotate" from="262 500 500" to="270 500 500" dur=".34s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".35 0 .18 1"/>
    </use>
    <use href="#blade" transform="rotate(307 500 500)">
      <animateTransform attributeName="transform" type="rotate" from="307 500 500" to="315 500 500" dur=".34s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".35 0 .18 1"/>
    </use>
  </g>

  <g id="smiley" opacity="0" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.06;.82;1" dur=".34s" fill="freeze"/>
    <circle cx="500" cy="500" r="220"/>
    <circle cx="447" cy="458" r="25" fill="#ffffff" stroke="none"/>
    <rect id="right-eye" x="528" y="433" width="50" height="50" rx="25" fill="#ffffff" stroke="none">
      <animate attributeName="y" values="433;450.5;450.5;433" keyTimes="0;.35;.45;1" begin=".38s" dur=".40s" fill="freeze" calcMode="spline" keySplines=".55 0 .45 1;0 0 1 1;.20 0 .15 1"/>
      <animate attributeName="height" values="50;15;15;50" keyTimes="0;.35;.45;1" begin=".38s" dur=".40s" fill="freeze" calcMode="spline" keySplines=".55 0 .45 1;0 0 1 1;.20 0 .15 1"/>
      <animate attributeName="rx" values="25;7.5;7.5;25" keyTimes="0;.35;.45;1" begin=".38s" dur=".40s" fill="freeze" calcMode="spline" keySplines=".55 0 .45 1;0 0 1 1;.20 0 .15 1"/>
    </rect>
    <path d="M 390 544 Q 500 625 610 544"/>
  </g>
</svg>
